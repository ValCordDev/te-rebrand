# Production stack for Coolify (Docker Compose build pack). See docs/COOLIFY.md.
#
# In Coolify: New resource > Public/Private repository > Build pack "Docker
# Compose", Docker Compose Location "/docker-compose.coolify.yml".
#
# Differences from infra/docker-compose.prod.yml:
# - Coolify builds the images from this repo, so there is no registry/TAG.
# - Coolify's proxy (Traefik or Caddy) terminates TLS and routes the domain to
#   web:3001, WebSockets included, so there is no Caddy service and no service
#   publishes a port.
# - Secrets are generated by Coolify (SERVICE_PASSWORD_*) or set in its
#   Environment Variables tab; nothing is read from a file in the repo.
# - No container_name: Coolify names containers per resource.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tacho
      POSTGRES_USER: tacho
      # Generated once by Coolify (letters and digits only, so it is safe in a URL).
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacho -d tacho"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations, then exits. web and bot start
  # only after it finished successfully. Built from the web Dockerfile (same
  # commit's schema and migrations; BuildKit reuses the web build's layers).
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /app/packages/db
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tacho:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tacho
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # It exits after running; don't let Coolify report the stack as unhealthy.
    exclude_from_hc: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      # Coolify: give this service a domain and route it to port 3001. Set the
      # real domain in the web service's "Domains" field (https://...).
      - SERVICE_URL_WEB_3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tacho:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tacho
      # The public URL (Discord OAuth redirect, links, WebSocket origin check).
      - BETTER_AUTH_URL=${SERVICE_URL_WEB}
      # Generated once by Coolify, 64 characters.
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_BETTERAUTH}
      # Discord application > OAuth2. Redirect to add there:
      #   <BETTER_AUTH_URL>/api/auth/callback/discord
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?}
      # Optional (apps/web/.env.schema).
      - STEAM_WEB_API_KEY=${STEAM_WEB_API_KEY:-}
      - TRACKER_DOWNLOAD_URL=${TRACKER_DOWNLOAD_URL:-}
      - LIVE_MAP_ETS2_TILE_URL=${LIVE_MAP_ETS2_TILE_URL:-}
      - LIVE_MAP_ETS2_BOUNDS=${LIVE_MAP_ETS2_BOUNDS:-}
      - LIVE_MAP_ETS2_MAX_ZOOM=${LIVE_MAP_ETS2_MAX_ZOOM:-}
      - LIVE_MAP_ETS2_TILE_SIZE=${LIVE_MAP_ETS2_TILE_SIZE:-}
      - LIVE_MAP_ETS2_ATTRIBUTION=${LIVE_MAP_ETS2_ATTRIBUTION:-}
      - LIVE_MAP_ATS_TILE_URL=${LIVE_MAP_ATS_TILE_URL:-}
      - LIVE_MAP_ATS_BOUNDS=${LIVE_MAP_ATS_BOUNDS:-}
      - LIVE_MAP_ATS_MAX_ZOOM=${LIVE_MAP_ATS_MAX_ZOOM:-}
      - LIVE_MAP_ATS_TILE_SIZE=${LIVE_MAP_ATS_TILE_SIZE:-}
      - LIVE_MAP_ATS_ATTRIBUTION=${LIVE_MAP_ATS_ATTRIBUTION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # One copy only: the daily TruckersMP membership check and the live map
    # hub run inside this process (apps/web/src/services.ts).
    restart: unless-stopped

  # The Discord bot (apps/bot/README.md). One copy only. Without
  # DISCORD_BOT_TOKEN it starts, says so and stays idle.
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tacho:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tacho
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
